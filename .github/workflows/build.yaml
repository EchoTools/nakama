on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  gofmt_check:
    name: Check gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      # Runs the same recipe developers run locally, so CI and local behavior
      # cannot drift. Scope (all tracked, non-generated Go files) is defined once
      # in the justfile's FMT_FILES.
      - name: Verify formatting
        run: just fmt-check

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # lint-new resolves a merge-base

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install just
        uses: extractions/setup-just@v4

      # Pinned, not @latest. The justfile's LINT_BASELINE is a count, and a
      # linter release that adds a check or fixes a false negative moves that
      # count -- so @latest would turn an upstream release into a red build on
      # a commit that changed nothing. v2.12.2 is the version the 374 baseline
      # was measured with. Bump it and the baseline together, deliberately.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Download modules
        run: go mod download

      # The check that actually holds the line. The backlog ratchet below only
      # catches a NET rise, so fixing one old finding while adding a new one
      # slips past it; this does not care about the backlog at all, only about
      # what the branch added.
      - name: No new findings on this branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          just lint-new "origin/${{ github.base_ref }}"

      # Same recipe developers run locally, so CI and local cannot drift. It
      # also carries the did-not-run and stale-cache guards -- see the comments
      # on `lint` in the justfile, and AGENTS.md defect classes 4 and 6.
      - name: Backlog ratchet
        run: just lint

  exec_bit_check:
    name: Check script exec bits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v4

      # Runs the same recipe developers run locally. The check reads modes from
      # the git index, not from disk, so it cannot be fooled by a local
      # core.fileMode=false — which is exactly what hid this class of breakage
      # until scripts/bench-compare.sh shipped non-executable.
      - name: Verify script exec bits
        run: just exec-bit-check

  build_binary:
    name: Build nakama binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git describe tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true  # Built-in caching for Go modules and build cache

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Vendor dependencies
        run: go mod tidy && go mod vendor

      - name: Build binary
        run: just nakama

  test:
    name: Run DB-free test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git describe tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true  # Built-in caching for Go modules and build cache

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Vendor dependencies
        run: go mod tidy && go mod vendor

      # No repo-wide `gofmt -l` gate yet: ~50 files under server/ are already
      # unformatted at this commit, so the check would fail on arrival. Adding it
      # needs its own mechanical reformat PR.
      - name: Vet
        # Same scope as the test suite. These drifted apart when the test scope
        # widened to the whole repo: vet stayed on ./server/... and silently
        # stopped covering everything the tests had started covering.
        # The `grep . ||` tail is load-bearing, and is the same guard the
        # justfile and scripts/test-audit.sh already carry. Without it, a
        # failing or empty `go list` leaves the substitution empty, `go vet`
        # runs bare on the repo root package alone, and the step passes having
        # vetted almost nothing -- set -e does not propagate a failure from a
        # command substitution used as an argument.
        run: |
          PKGS=$(go list ./... | grep -v '/internal/gopher-lua' | grep . || {
            echo "vet: go list matched no packages" >&2
            exit 1
          })
          go vet $PKGS

      # No CockroachDB service and no DISCORD_BOT_TOKEN: the DB-backed tests
      # skip themselves when no database is reachable. `just test-db` is the
      # recipe that requires one.
      #
      # test-audit rather than test: same suite, plus a per-package floor on how
      # many tests actually passed, and a printed count of what skipped. `ok` on
      # its own is not a claim about coverage -- see scripts/test-audit.sh.
      - name: Run tests
        run: just test-audit
