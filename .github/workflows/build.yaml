on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  gofmt_check:
    name: Check gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      # Runs the same recipe developers run locally, so CI and local behavior
      # cannot drift. Scope (all tracked, non-generated Go files) is defined once
      # in the justfile's FMT_FILES.
      - name: Verify formatting
        run: just fmt-check

  exec_bit_check:
    name: Check script exec bits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v4

      # Runs the same recipe developers run locally. The check reads modes from
      # the git index, not from disk, so it cannot be fooled by a local
      # core.fileMode=false — which is exactly what hid this class of breakage
      # until scripts/bench-compare.sh shipped non-executable.
      - name: Verify script exec bits
        run: just exec-bit-check

  build_binary:
    name: Build nakama binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git describe tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true  # Built-in caching for Go modules and build cache

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Vendor dependencies
        run: go mod tidy && go mod vendor

      - name: Build binary
        run: just nakama

  test:
    name: Run DB-free test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git describe tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true  # Built-in caching for Go modules and build cache

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Vendor dependencies
        run: go mod tidy && go mod vendor

      # No repo-wide `gofmt -l` gate yet: ~50 files under server/ are already
      # unformatted at this commit, so the check would fail on arrival. Adding it
      # needs its own mechanical reformat PR.
      - name: Vet
        run: go vet ./server/...

      # No CockroachDB service and no DISCORD_BOT_TOKEN: the DB-backed tests
      # skip themselves when no database is reachable. `just test-db` is the
      # recipe that requires one.
      - name: Run tests
        run: just test
