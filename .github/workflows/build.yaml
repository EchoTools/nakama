on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

jobs:
  gofmt_check:
    name: Check gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      # Runs the same recipe developers run locally, so CI and local behavior
      # cannot drift. Scope (all tracked, non-generated Go files) is defined once
      # in the justfile's FMT_FILES.
      - name: Verify formatting
        run: just fmt-check

  build_binary:
    name: Build nakama binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git describe tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true  # Built-in caching for Go modules and build cache

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Vendor dependencies
        run: go mod tidy && go mod vendor

      - name: Build binary
        run: just nakama